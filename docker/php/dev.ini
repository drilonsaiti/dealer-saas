; Local development only (Dockerfile target "dev").
; Check files for changes (at most every 2 seconds), so edits and git pulls show up without a restart.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
; Fewer file system lookups: these are slow on Docker Desktop bind mounts (Windows, macOS).
realpath_cache_size = 4096K
realpath_cache_ttl = 600
max_execution_time = 300
